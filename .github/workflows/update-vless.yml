
    
  
name: Update personal VLESS feed

on:
  schedule:
    - cron: '11,41 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: personal-vless-feed
  cancel-in-progress: false

jobs:
  collect-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Install official Xray-core (SHA256 verified)
        run: python scripts/install_xray.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Collect and test public VLESS nodes
        run: python collector.py
        env:
          XRAY_BIN: ${{ github.workspace }}/bin/xray
          MAX_CANDIDATES: '240'
          MAX_WORKERS: '12'
          PROBE_TIMEOUT: '9'

      - name: Commit generated subscriptions without rebasing generated files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          for attempt in 1 2 3; do
            echo "Push attempt ${attempt}/3"

            # Update Git HEAD/index to the latest remote commit, but keep
            # the freshly generated feed files in the working directory.
            git fetch origin "${GITHUB_REF_NAME}"
            git reset --mixed "origin/${GITHUB_REF_NAME}"

            # Stage only generated files: never overwrite source code/workflows.
            git add -A feeds/
            if git diff --cached --quiet; then
              echo 'Feeds have not changed; nothing to commit.'
              break
            fi

            git commit -m 'chore: refresh VLESS subscriptions [skip ci]'
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo 'Feed commit successfully pushed.'
              break
            fi

            if [ "${attempt}" -eq 3 ]; then
              echo 'Failed to push generated feeds after three attempts.' >&2
              exit 1
            fi
            sleep 3
          done

      - name: Prepare GitHub Pages artifact for project site
        shell: bash
        run: |
          set -euo pipefail
          test -s feeds/vless.txt
          test -f feeds/index.html
          mkdir -p _site
          cp -a feeds/. _site/
          touch _site/.nojekyll
          test -s _site/vless.txt

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

