name: Update personal VLESS feed

on:
  schedule:
    - cron: '11,41 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: personal-vless-feed
  cancel-in-progress: false

jobs:
  collect-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Install official Xray-core (SHA256 verified)
        run: python scripts/install_xray.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Collect and test public VLESS nodes
        run: python collector.py
        env:
          XRAY_BIN: ${{ github.workspace }}/bin/xray
          MAX_CANDIDATES: '240'
          MAX_WORKERS: '12'
          PROBE_TIMEOUT: '9'

      - name: Commit only files produced by the cloud collector
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          for attempt in 1 2 3; do
            echo "Push attempt ${attempt}/3"

            # Move the index to the latest remote commit while keeping
            # the collector-generated files in the working directory.
            git fetch origin "${GITHUB_REF_NAME}"
            git reset --mixed "origin/${GITHUB_REF_NAME}"

            # Never stage feeds/local_* files maintained by the Windows agent.
            git add -A -- \
              feeds/vless.txt \
              feeds/vless_base64.txt \
              feeds/vless_reality.txt \
              feeds/ru_verified.txt \
              feeds/ru_whitelist_verified.txt \
              feeds/ru_candidates_unverified.txt \
              feeds/status.json \
              feeds/index.html

            if git diff --cached --quiet; then
              echo 'Cloud feeds unchanged.'
              break
            fi

            git commit -m 'chore: refresh VLESS subscriptions [skip ci]'
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo 'Cloud feed changes pushed.'
              break
            fi

            if [ "${attempt}" -eq 3 ]; then
              echo 'Unable to push cloud feeds after three attempts' >&2
              exit 1
            fi
            sleep 3
          done

      - name: Prepare GitHub Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          test -s feeds/vless.txt
          test -f feeds/index.html

          # Refresh local_* files so a late Windows agent upload is included.
          git fetch origin "${GITHUB_REF_NAME}"
          for name in local_verified.txt local_verified_base64.txt local_ru_verified.txt local_status.json; do
            remote_file="origin/${GITHUB_REF_NAME}:feeds/${name}"
            if git cat-file -e "${remote_file}" 2>/dev/null; then
              git show "${remote_file}" > "feeds/${name}"
            else
              rm -f "feeds/${name}"
            fi
          done

          mkdir -p _site
          cp -a feeds/. _site/
          touch _site/.nojekyll
          test -s _site/vless.txt

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
